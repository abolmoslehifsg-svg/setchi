name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ymbkdwayywntbelgshcn.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_7KtcOG_A3aI4OUFV8DXyOA_4zf42FyP

      - name: Verify key pages exist
        run: |
          test -f out/index.html
          test -d out/about || test -d out/about/
          test -d out/contact || test -d out/contact/
          test -d out/collaborate || test -d out/collaborate/
          test -d out/wardrobe || test -d out/wardrobe/
          ls -la out | head -40

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
